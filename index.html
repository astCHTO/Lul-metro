<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lulômetro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: rgb(20, 20, 20);
      color: white;
      font-size: 32px;
    }

    .links {
      margin-top: 20px;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #000000;
      color: #fff;
      text-decoration: none;
      border: 1px solid red;
      border-radius: 10px;
      margin: 20px;
    }
  </style>
</head>

<body>
  <h1>LULÔMETRO</h1>
  <div>SEJA BEM VINDO AO LULÔMETRO<br>ANTES DE ENTRAR CONFIRME QUE VOCÊ NÃO É UM FASCISTA<br>DE EXTREMA DIREITA</div>
  <div class="links">
    <a href="\lulometro.html" class="btn">SOU DEMOCRÁTICO</a><a href="https://www.google.com" class="btn">SOU FASCISTA</a>
  </div>
  <script>
    const btn = document.querySelectorAll('.btn')
    btn.forEach((button) => {
      button.addEventListener('mouseenter', () => { button.style.color = 'red' })
      button.addEventListener('mouseleave', () => { button.style.color = 'white' })
    })
  </script>
</body>

</html>
